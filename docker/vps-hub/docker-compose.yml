services:
  headroom-proxy:
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom:latest}
    restart: unless-stopped
    command:
      - "--host"
      - "${HEADROOM_HOST:-0.0.0.0}"
      - "--port"
      - "${HEADROOM_PORT:-8787}"
      - "--memory"
      - "--memory-storage"
      - "global"
      - "--memory-db-path"
      - "/data/headroom/memory.db"
    environment:
      - HEADROOM_HOST=${HEADROOM_HOST:-0.0.0.0}
      - HEADROOM_PORT=${HEADROOM_PORT:-8787}
      - HEADROOM_WORKSPACE_DIR=/data/headroom
      - HEADROOM_REQUIRE_RUST_CORE=${HEADROOM_REQUIRE_RUST_CORE:-true}
      - HEADROOM_TELEMETRY=${HEADROOM_TELEMETRY:-off}
      - OPENAI_TARGET_API_URL=${OPENAI_TARGET_API_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${HEADROOM_PORT:-8787}:8787"
    volumes:
      - headroom_data:/data/headroom
    labels:
      - "traefik.http.middlewares.headroom-timeout.buffering.maxRequestBodyBytes=10485760"
      - "traefik.http.middlewares.headroom-timeout.buffering.memRequestBodyBytes=10485760"
      - "traefik.http.middlewares.headroom-timeout.buffering.retryExpression=IsNetworkError() && Attempts() < 2"
      - "traefik.http.routers.headroom-proxy.middlewares=headroom-timeout"
      - "traefik.http.services.headroom-proxy.loadbalancer.server.port=8787"
      - "traefik.http.middlewares.headroom-retry.retry.attempts=3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  headroom_data:
